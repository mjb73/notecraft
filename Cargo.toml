[package]
name = "notecraft"
version = "1.3.0"
edition = "2024"
rust-version = "1.90"
description = "NoteCraft — a fast native notes, todos and idea-capture app. Plain markdown on disk."
authors = ["Michael Bayes"]
license = "MIT"
repository = "https://github.com/mjb73/notecraft"
homepage = "https://github.com/mjb73/notecraft"
readme = "README.md"
keywords = ["notes", "markdown", "todo", "egui", "note-taking"]
categories = ["gui", "text-editors"]
exclude = ["vendor/**", ".github/**"]

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.33"
egui_extras = { version = "0.33", features = ["image", "file"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
directories = "6"
# Native file choosers: the XDG desktop portal on Linux (no GTK headers to build against),
# IFileOpenDialog on Windows, NSOpenPanel on macOS.
rfd = "0.17"
# Spelling: the two word lists are embedded gzipped (1.5 MB instead of 7 MB), decompressed once
# when spelling is switched on. Already in the graph via `image`/`png`, so this costs nothing.
flate2 = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Dragging a picture *out* of the app: winit only implements the XDND destination half, so the
# source half (selection owner, pointer grab, XdndEnter/Position/Drop) is spoken directly. The same
# crate and version winit already uses, so this costs nothing in the dependency graph.
x11rb = "0.13"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# The app's own OLE drop target (src/windows_dnd.rs): browsers hand a dragged image over as a
# virtual file or as PNG bytes, neither of which is CF_HDROP, so the toolkit never sees it.
windows = { version = "0.59", default-features = false, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell"] }
# `#[implement]` expands to `windows_core::` paths.
windows-core = "0.59"
# Reading the window handle eframe was given, to register the drop target on it.
raw-window-handle = "0.6"
# AttachConsole, so the CLI verbs (`notecraft new "..."`) print into the terminal that started
# them even though the binary is a windowed app (no console window on a double-click).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[build-dependencies]
# The exe's icon, version resource and DPI-awareness manifest. Compiled on every host (a build
# script is host code) but only *used* when the target is Windows, which is what makes
# cross-compiling from Linux work too.
winresource = "0.1"

[profile.release]
opt-level = 2
strip = true
lto = "thin"
codegen-units = 4

[patch.crates-io]
# Local patch so the X11 drop target also accepts image payloads (browsers drag an image as
# image/png, which upstream winit rejects outright). Only the DnD code in vendor/winit is
# touched; see the NOTE comments there. Not compiled on Windows or macOS.
winit = { path = "vendor/winit" }
# Local patch: a paste with only a picture on the clipboard used to emit no event at all (the key
# press is swallowed in the same branch), so Ctrl+V looked like nothing had been pressed. One line
# in `on_keyboard_input`; see the NOTE comment there.
egui-winit = { path = "vendor/egui-winit" }

[package.metadata.deb]
maintainer = "Michael Bayes <mjbayes@pm.me>"
copyright = "2026 Michael Bayes"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
A fast, native notes app: notebooks, sections and pages kept as plain markdown files in a folder \
you choose; a block editor with read mode, tasks with due dates, tags, image attachments, screen \
snips, spellcheck, and HTML/PDF/text export. No account, no database, no lock-in."""
assets = [
    ["target/release/notecraft", "usr/bin/", "755"],
    ["packaging/linux/notecraft.desktop", "usr/share/applications/", "644"],
    ["assets/notecraft.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
