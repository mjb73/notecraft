name: Release

# Tag a commit and the downloads appear:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Artifacts: a Linux tarball and .deb, a macOS .dmg per architecture, a Windows .zip, and a
# .sha256 beside each one. Nothing is code-signed except the macOS bundle, which is signed
# ad-hoc — see README "Download" for what that means for the user.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Built inside an old-base image on purpose. The glibc a binary is linked against becomes the
    # glibc every user needs, and building on the runner image itself set that floor to 2.39
    # (Ubuntu 24.04) — which refuses to start on Debian 12, Mint 22 or Fedora 38. Debian 12 gives
    # 2.36. The image is `node:` rather than `debian:` because a container job runs the `uses:`
    # actions inside the container, and those need node, git and curl.
    container: node:22-bookworm
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04-arm is GitHub's hosted arm64 runner; it is newer than the x86 one, hence
          # `experimental` — if it is unavailable in your account the x86 build still releases.
          - arch: x86_64
            debarch: amd64
            runner: ubuntu-24.04
            experimental: false
          - arch: aarch64
            debarch: arm64
            runner: ubuntu-24.04-arm
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain and build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates libxkbcommon-dev libwayland-dev libgl1-mesa-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.90
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        run: cargo build --locked --release

      # Printed so the log itself proves the floor: a release whose `Depends: libc6 (>= …)` claims
      # an older glibc than the build used installs and then dies at load with a version error.
      - name: Report the glibc floor
        run: |
          echo "highest glibc symbol requested by the binary:"
          readelf --version-info target/release/notecraft \
            | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV | tail -3

      - name: Package tarball
        run: |
          V=${GITHUB_REF_NAME#v}
          D=notecraft-$V-${{ matrix.arch }}-linux
          mkdir -p dist/$D
          cp target/release/notecraft dist/$D/
          cp packaging/linux/notecraft.desktop dist/$D/
          cp assets/notecraft.svg dist/$D/
          cp README.md LICENSE dist/$D/
          tar -C dist -czf dist/$D.tar.gz $D

      - name: Debian package
        run: |
          V=${GITHUB_REF_NAME#v}
          chmod +x packaging/linux/make-deb.sh
          packaging/linux/make-deb.sh target/release/notecraft "$V" ${{ matrix.debarch }} dist

      - name: Checksums
        run: |
          cd dist
          for f in *.tar.gz *.deb; do sha256sum "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macos (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Bundle and sign
        run: |
          V=${GITHUB_REF_NAME#v}
          chmod +x packaging/macos/make-app.sh
          packaging/macos/make-app.sh \
            "target/${{ matrix.target }}/release/notecraft" "$V" "dist"
          mv "dist/NoteCraft-$V.dmg" "dist/NoteCraft-$V-${{ matrix.arch }}.dmg"
          ( cd dist && shasum -a 256 "NoteCraft-$V-${{ matrix.arch }}.dmg" \
              > "NoteCraft-$V-${{ matrix.arch }}.dmg.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: windows (x86_64)
    runs-on: windows-2022
    # Static C runtime on purpose. The default MSVC build imports VCRUNTIME140.dll, which comes from
    # the Visual C++ redistributable — present on most PCs, absent on a clean install, where the zip
    # then fails to start with "VCRUNTIME140.dll was not found". This makes the exe self-contained.
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64-static-crt

      - name: Build
        run: cargo build --locked --release

      # Proves the flag did what it says: no vcruntime in the import table.
      - name: Check the runtime dependency
        shell: pwsh
        run: |
          cmd /c 'findstr /M /C:"VCRUNTIME140.dll" target\release\notecraft.exe' | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "still imports VCRUNTIME140.dll - the static CRT flag did not apply"
            exit 1
          }
          Write-Host "no VCRUNTIME140.dll import: the exe is self-contained"

      - name: Package
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $d = "notecraft-$v-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$d" | Out-Null
          Copy-Item target/release/notecraft.exe "dist/$d/"
          Copy-Item README.md, LICENSE "dist/$d/"
          Compress-Archive -Path "dist/$d/*" -DestinationPath "dist/$d.zip" -Force
          $h = (Get-FileHash "dist/$d.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $d.zip" | Out-File -Encoding ascii "dist/$d.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: [linux, macos, windows]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloads
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            NoteCraft ${{ github.ref_name }} — notes, todos and ideas as plain markdown.

            **Linux** — `install.sh` (no root), or the `.deb`, or the tarball.
            ```sh
            curl -fsSL https://raw.githubusercontent.com/mjb73/notecraft/main/install.sh | sh
            ```
            **macOS** — open the `.dmg` for your Mac (`aarch64` for Apple silicon, `x86_64` for Intel)
            and drag NoteCraft to Applications. The app is signed ad-hoc, so the first launch needs
            right-click → Open (or System Settings → Privacy & Security → Open Anyway).

            **Windows** — unzip and run `notecraft.exe`. SmartScreen may warn about an unsigned
            download: More info → Run anyway.

            Your notes are plain markdown in `Documents/NoteCraft`; nothing leaves your machine.
